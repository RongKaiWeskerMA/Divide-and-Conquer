[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dac"
dynamic = ["version"]
description = "Divide and Conquer: Rethinking the Training Paradigm of Neural Radiance Fields"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "imageio>=2.9",
    "imageio-ffmpeg",
    "numpy",
    "pillow>=8",
    "pyyaml>=5.4",
    "scipy",
    "tensorboard",
    "torch>=1.13",
    "torchmetrics>=0.11",
    "tqdm",
]

[project.optional-dependencies]
metrics = ["lpips"]
dev = ["mypy>=1.8", "pre-commit", "pytest>=7", "ruff>=0.6", "types-PyYAML"]

[project.scripts]
dac = "dac.cli:main"

[project.urls]
Paper = "https://arxiv.org/abs/2401.16144"

[tool.setuptools.dynamic]
version = { attr = "dac.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY", "PT", "N", "C4", "PIE", "RET"]
ignore = [
    "RUF001", # ambiguous unicode in strings
    "RUF002", # ambiguous unicode in docstrings
    "NPY002", # seeding the legacy global numpy RNG is intentional
    "N812",   # `import torch.nn.functional as F` is the PyTorch convention
]

[tool.ruff.lint.isort]
known-first-party = ["dac"]

[tool.mypy]
files = ["src/dac"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:tensorboard.*",
]
